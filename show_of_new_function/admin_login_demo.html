<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CourseQA · 管理员登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { font-family: "Microsoft YaHei", system-ui, sans-serif; }

        .bg-admin {
            background: linear-gradient(135deg, #1e0442 0%, #3b0764 40%, #6d28d9 100%);
        }

        /* 背景装饰圆 */
        .deco-circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.08;
            background: white;
            pointer-events: none;
        }

        .input-field {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.75rem;
            border: 1.5px solid #e5e7eb;
            border-radius: 1rem;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #fafafa;
        }
        .input-field:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12);
            background: #fff;
        }
        .input-field.error {
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.10);
        }

        .btn-login {
            width: 100%;
            padding: 0.8rem;
            border-radius: 1rem;
            font-weight: 600;
            font-size: 0.95rem;
            color: white;
            background: linear-gradient(135deg, #5b21b6, #7c3aed);
            border: none;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 14px rgba(109, 40, 217, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn-login:hover { opacity: 0.92; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(109,40,217,0.4); }
        .btn-login:active { transform: translateY(0); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { animation: spin 0.8s linear infinite; display: inline-block; }

        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20%,60%  { transform: translateX(-6px); }
            40%,80%  { transform: translateX(6px); }
        }
        .shake { animation: shake 0.4s ease; }

        @keyframes fade-up {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .fade-up { animation: fade-up 0.35s ease; }

        @keyframes pulse-ring {
            0%   { box-shadow: 0 0 0 0 rgba(124,58,237,0.45); }
            70%  { box-shadow: 0 0 0 12px rgba(124,58,237,0); }
            100% { box-shadow: 0 0 0 0 rgba(124,58,237,0); }
        }
        .pulse-ring { animation: pulse-ring 1.5s infinite; }

        /* 成功遮罩 */
        #success-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(30,4,66,0.55);
            backdrop-filter: blur(4px);
            z-index: 999;
            align-items: center;
            justify-content: center;
        }
        #success-overlay.show { display: flex; }

        @keyframes pop-in {
            0%   { transform: scale(0.7); opacity: 0; }
            70%  { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); }
        }
        .pop-in { animation: pop-in 0.4s cubic-bezier(.34,1.56,.64,1) forwards; }

        /* 安全徽章 */
        .security-badge {
            display: flex; align-items: center; gap: 0.35rem;
            font-size: 0.72rem; color: #a78bfa;
        }

        /* 提示文字 */
        .hint-row {
            display: flex; align-items: center; justify-content: space-between;
            margin-top: 0.25rem; padding: 0 0.25rem;
        }
    </style>
</head>
<body class="bg-admin min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- 背景装饰 -->
    <div class="deco-circle" style="width:420px;height:420px;top:-140px;right:-120px;"></div>
    <div class="deco-circle" style="width:280px;height:280px;bottom:-80px;left:-80px;"></div>
    <div class="deco-circle" style="width:160px;height:160px;top:30%;left:8%;opacity:0.05;"></div>

    <div class="w-full max-w-sm relative z-10">

        <!-- Logo 区 -->
        <div class="text-center mb-8 fade-up">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl mb-4 pulse-ring"
                 style="background:linear-gradient(135deg,#5b21b6,#7c3aed);">
                <i class="fas fa-shield-halved text-white text-2xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-white mb-1 tracking-tight">CourseQA</h1>
            <p class="text-purple-300 text-sm">管理后台 · 安全登录</p>
        </div>

        <!-- 登录卡片 -->
        <div class="bg-white rounded-3xl shadow-2xl p-8 fade-up" style="animation-delay:0.08s;">

            <div class="mb-6">
                <h2 class="text-lg font-semibold text-gray-800">管理员身份验证</h2>
                <p class="text-xs text-gray-400 mt-0.5">仅限授权管理员访问</p>
            </div>

            <div class="space-y-4">
                <!-- 用户名 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">管理员账号</label>
                    <div class="relative">
                        <i class="fas fa-user-shield absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                        <input id="username" type="text" placeholder="请输入管理员账号"
                               class="input-field" autocomplete="username"
                               onkeydown="if(event.key==='Enter') tryLogin()">
                    </div>
                </div>

                <!-- 密码 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">登录密码</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                        <input id="password" type="password" placeholder="请输入密码"
                               class="input-field" autocomplete="current-password"
                               onkeydown="if(event.key==='Enter') tryLogin()">
                        <button onclick="togglePwd()" type="button"
                                class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors">
                            <i id="eye-icon" class="fas fa-eye-slash text-sm"></i>
                        </button>
                    </div>
                </div>

                <!-- 验证码 -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">验证码</label>
                    <div class="flex gap-2">
                        <div class="relative flex-1">
                            <i class="fas fa-key absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                            <input id="captcha" type="text" placeholder="请输入验证码"
                                   class="input-field" maxlength="4"
                                   onkeydown="if(event.key==='Enter') tryLogin()">
                        </div>
                        <div onclick="refreshCaptcha()"
                             id="captcha-box"
                             class="flex-shrink-0 w-24 h-12 rounded-xl cursor-pointer flex items-center justify-center select-none"
                             style="background:linear-gradient(135deg,#ede9fe,#ddd6fe); border:1.5px solid #c4b5fd;"
                             title="点击刷新">
                        </div>
                    </div>
                    <div class="hint-row">
                        <span class="text-xs text-gray-400">不区分大小写</span>
                        <button onclick="refreshCaptcha()" class="text-xs text-purple-500 hover:text-purple-700 transition-colors">
                            <i class="fas fa-rotate-right mr-0.5 text-[10px]"></i>换一张
                        </button>
                    </div>
                </div>

                <!-- 错误提示 -->
                <div id="error-msg" class="hidden flex items-center gap-2 bg-red-50 border border-red-200 text-red-600 text-sm px-4 py-2.5 rounded-xl">
                    <i class="fas fa-circle-exclamation text-red-400"></i>
                    <span id="error-text"></span>
                </div>

                <!-- 登录按钮 -->
                <button id="login-btn" class="btn-login" onclick="tryLogin()">
                    <i class="fas fa-shield-halved"></i>
                    <span id="btn-text">安全登录</span>
                </button>
            </div>

            <!-- 安全提示 -->
            <div class="mt-5 pt-4 border-t border-gray-100 flex items-center justify-between">
                <div class="security-badge">
                    <i class="fas fa-lock text-[10px]"></i>
                    <span>SSL 加密传输</span>
                </div>
                <div class="security-badge">
                    <i class="fas fa-shield-check text-[10px]"></i>
                    <span>二次身份校验</span>
                </div>
                <div class="security-badge">
                    <i class="fas fa-clock-rotate-left text-[10px]"></i>
                    <span>操作日志记录</span>
                </div>
            </div>
        </div>

        <!-- 底部提示 -->
        <p class="text-center text-xs text-purple-300/60 mt-6">
            CourseQA · 课程智能问答辅助系统 · 内部管理平台
        </p>
    </div>

    <!-- 登录成功遮罩 -->
    <div id="success-overlay">
        <div class="bg-white rounded-3xl shadow-2xl p-10 flex flex-col items-center gap-4 pop-in" style="min-width:260px">
            <div class="w-16 h-16 rounded-full bg-gradient-to-br from-purple-500 to-violet-600 flex items-center justify-center shadow-lg">
                <i class="fas fa-check text-white text-2xl"></i>
            </div>
            <div class="text-center">
                <p class="text-lg font-bold text-gray-800">验证成功</p>
                <p class="text-sm text-gray-500 mt-1">正在进入管理后台…</p>
            </div>
            <div class="flex gap-1 mt-1">
                <span class="w-2 h-2 rounded-full bg-purple-400" style="animation:bounce 0.8s 0s infinite alternate"></span>
                <span class="w-2 h-2 rounded-full bg-purple-400" style="animation:bounce 0.8s 0.2s infinite alternate"></span>
                <span class="w-2 h-2 rounded-full bg-purple-400" style="animation:bounce 0.8s 0.4s infinite alternate"></span>
            </div>
        </div>
    </div>

    <style>
        @keyframes bounce { from{transform:translateY(0)} to{transform:translateY(-6px)} }
    </style>

    <script>
        // ── Mock 数据 ──
        const MOCK_ADMIN = { username: 'admin', password: 'admin888' };

        // ── 验证码逻辑 ──
        const CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        let currentCaptcha = '';

        function genCaptcha() {
            let s = '';
            for (let i = 0; i < 4; i++) s += CHARS[Math.floor(Math.random() * CHARS.length)];
            return s;
        }

        function drawCaptcha(text) {
            const box = document.getElementById('captcha-box');
            // Canvas 绘制
            let canvas = box.querySelector('canvas');
            if (!canvas) {
                canvas = document.createElement('canvas');
                canvas.width = 88; canvas.height = 44;
                box.appendChild(canvas);
            }
            const ctx = canvas.getContext('2d');
            // 背景
            ctx.clearRect(0, 0, 88, 44);
            // 干扰线
            for (let i = 0; i < 4; i++) {
                ctx.strokeStyle = `hsl(${Math.random()*360},50%,75%)`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(Math.random() * 88, Math.random() * 44);
                ctx.lineTo(Math.random() * 88, Math.random() * 44);
                ctx.stroke();
            }
            // 字符
            const colors = ['#5b21b6','#7c3aed','#6d28d9','#4c1d95'];
            for (let i = 0; i < text.length; i++) {
                ctx.save();
                ctx.font = `bold ${18 + Math.random()*4}px monospace`;
                ctx.fillStyle = colors[i % colors.length];
                ctx.translate(10 + i * 19, 28);
                ctx.rotate((Math.random() - 0.5) * 0.4);
                ctx.fillText(text[i], 0, 0);
                ctx.restore();
            }
            // 干扰点
            for (let i = 0; i < 30; i++) {
                ctx.fillStyle = `hsl(${Math.random()*360},40%,75%)`;
                ctx.beginPath();
                ctx.arc(Math.random()*88, Math.random()*44, 1, 0, Math.PI*2);
                ctx.fill();
            }
        }

        function refreshCaptcha() {
            currentCaptcha = genCaptcha();
            drawCaptcha(currentCaptcha);
            document.getElementById('captcha').value = '';
        }

        // ── 密码显隐 ──
        function togglePwd() {
            const inp = document.getElementById('password');
            const ico = document.getElementById('eye-icon');
            if (inp.type === 'password') {
                inp.type = 'text';
                ico.className = 'fas fa-eye text-sm';
            } else {
                inp.type = 'password';
                ico.className = 'fas fa-eye-slash text-sm';
            }
        }

        // ── 错误提示 ──
        function showError(msg) {
            const box = document.getElementById('error-msg');
            document.getElementById('error-text').textContent = msg;
            box.classList.remove('hidden');
            // 抖动卡片
            const card = box.closest('.bg-white');
            card.classList.remove('shake');
            void card.offsetWidth;
            card.classList.add('shake');
        }
        function clearError() {
            document.getElementById('error-msg').classList.add('hidden');
        }

        // ── 输入框状态 ──
        function setFieldError(id, isError) {
            const el = document.getElementById(id);
            if (isError) el.classList.add('error');
            else el.classList.remove('error');
        }

        // ── 登录逻辑（Mock） ──
        let loginCount = 0;

        async function tryLogin() {
            clearError();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const captchaInput = document.getElementById('captcha').value.trim().toUpperCase();

            // 基础校验
            if (!username) { setFieldError('username', true); showError('请输入管理员账号'); return; }
            setFieldError('username', false);
            if (!password) { setFieldError('password', true); showError('请输入密码'); return; }
            setFieldError('password', false);
            if (!captchaInput) { setFieldError('captcha', true); showError('请输入验证码'); return; }
            setFieldError('captcha', false);
            if (captchaInput !== currentCaptcha) {
                setFieldError('captcha', true);
                showError('验证码错误，请重新输入');
                refreshCaptcha();
                return;
            }
            setFieldError('captcha', false);

            // 模拟加载
            const btn = document.getElementById('login-btn');
            const btnText = document.getElementById('btn-text');
            btn.disabled = true;
            btnText.innerHTML = '<span class="spinner inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full"></span> 验证中…';

            await sleep(1200);

            btn.disabled = false;
            btnText.innerHTML = '<i class="fas fa-shield-halved"></i> 安全登录';

            loginCount++;

            // Mock 凭据校验
            if (username === MOCK_ADMIN.username && password === MOCK_ADMIN.password) {
                // 成功
                document.getElementById('success-overlay').classList.add('show');
                // 2.5 秒后跳转演示页
                setTimeout(() => {
                    window.location.href = 'admin_demo.html';
                }, 2500);
            } else {
                // 失败
                refreshCaptcha();
                const remaining = Math.max(0, 5 - loginCount);
                if (loginCount >= 5) {
                    showError('登录失败次数过多，账号已临时锁定 15 分钟');
                } else {
                    showError(`账号或密码错误，还可尝试 ${remaining} 次`);
                }
                setFieldError('username', true);
                setFieldError('password', true);
            }
        }

        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

        // 初始化验证码
        refreshCaptcha();

        // 清除错误状态
        ['username','password','captcha'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => {
                setFieldError(id, false);
                clearError();
            });
        });
    </script>
</body>
</html>
