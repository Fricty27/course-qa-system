<body class="bg-gray-50 min-h-screen">

    <!-- ══════════════════════ 左侧导航栏 ══════════════════════ -->
    <div id="left-nav" class="fixed left-0 top-0 h-full bg-gray-900 flex flex-col overflow-hidden" style="width:200px;transition:width 0.25s;z-index:35">
        <div class="flex flex-col items-center py-5 px-3 border-b border-white/10 shrink-0">
            <div id="lnav-avatar" class="w-12 h-12 rounded-full overflow-hidden bg-blue-800 flex items-center justify-center mb-2 shrink-0">
                <i class="fas fa-chalkboard-teacher text-white text-lg"></i>
            </div>
            <span id="lnav-username" class="lnav-label text-white/80 text-sm font-medium truncate w-full text-center leading-tight mt-1"></span>
        </div>
        <nav class="flex-1 py-2">
            <button id="lnav-courses-btn" onclick="navigateTo('courses')"
                class="lnav-item w-full flex items-center gap-3 px-4 py-3.5 text-white bg-white/20 hover:bg-white/25 transition-colors">
                <i class="fas fa-chalkboard text-base shrink-0"></i>
                <span class="lnav-label text-sm whitespace-nowrap">我的课程</span>
            </button>
            <button id="lnav-msgs-btn" onclick="navigateTo('msgs')"
                class="lnav-item w-full flex items-center gap-3 px-4 py-3.5 text-white/70 hover:bg-white/10 hover:text-white transition-colors relative">
                <i class="fas fa-envelope text-base shrink-0"></i>
                <span class="lnav-label text-sm whitespace-nowrap">互动消息</span>
                <span id="msg-badge" class="hidden absolute top-2.5 left-7 min-w-[16px] h-4 bg-red-500 text-white text-[9px] font-bold rounded-full flex items-center justify-center px-1"></span>
            </button>
            <button id="lnav-notes-btn" onclick="navigateTo('notes')"
                class="lnav-item w-full flex items-center gap-3 px-4 py-3.5 text-white/70 hover:bg-white/10 hover:text-white transition-colors">
                <i class="fas fa-book-open text-base shrink-0"></i>
                <span class="lnav-label text-sm whitespace-nowrap">学生笔记</span>
            </button>
            <button id="lnav-settings-btn" onclick="navigateTo('settings')"
                class="lnav-item w-full flex items-center gap-3 px-4 py-3.5 text-white/70 hover:bg-white/10 hover:text-white transition-colors">
                <i class="fas fa-cog text-base shrink-0"></i>
                <span class="lnav-label text-sm whitespace-nowrap">设置</span>
            </button>
        </nav>
        <button onclick="toggleNavCollapse()"
            class="shrink-0 w-full flex items-center px-4 py-3 text-white/40 hover:text-white/70 border-t border-white/10 transition-colors">
            <span id="nav-collapse-label" class="lnav-label text-xs mr-auto">收起</span>
            <i id="nav-collapse-icon" class="fas fa-angle-double-left text-xs" style="transition:transform 0.25s"></i>
        </button>
    </div>

    <!-- ══════════════════════ 主内容区 ══════════════════════ -->
    <div id="main-wrap" style="margin-left:200px;transition:margin-left 0.25s">

    <!-- 顶栏 -->
    <div class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between sticky top-0 z-10">
        <div class="flex items-center gap-3">
            <span class="text-blue-600 font-bold text-xl">CourseQA</span>
            <span class="bg-blue-100 text-blue-700 text-xs px-2 py-1 rounded-full font-medium">教师端</span>
        </div>
        <div class="flex items-center gap-3">
            <!-- 头像 + 昵称（点击打开个人设置） -->
            <button onclick="openProfileModal()" id="nav-profile-btn"
                class="flex items-center gap-2 hover:opacity-80 transition-opacity cursor-pointer group">
                <div id="nav-avatar" class="w-9 h-9 rounded-full overflow-hidden border-2 border-blue-200 flex items-center justify-center bg-blue-50 shrink-0">
                    <i class="fas fa-chalkboard-teacher text-blue-400 text-sm"></i>
                </div>
                <span id="username-display" class="text-gray-700 text-sm font-medium group-hover:text-blue-600 transition-colors"></span>
                <i class="fas fa-pen text-gray-300 text-xs group-hover:text-blue-400 transition-colors"></i>
            </button>
            <button onclick="logout()" class="text-sm text-gray-400 hover:text-red-500 flex items-center gap-1 ml-1">
                <i class="fas fa-sign-out-alt"></i> 退出
            </button>
        </div>
    </div>

    <div id="page-courses" class="flex items-start">
        <!-- 左侧：Tab + 内容 -->
        <div class="flex-1 min-w-0 p-6">
        <!-- Tab 导航 -->
        <div class="flex gap-1 bg-white rounded-2xl p-1 shadow-sm mb-6 border border-gray-100">
            <button onclick="switchTab('courses')" id="tab-courses"
                class="tab-btn flex-1 py-3 rounded-xl text-sm font-medium transition-all bg-blue-600 text-white">
                <i class="fas fa-book mr-1"></i> 我的课程
            </button>
            <button onclick="switchTab('upload')" id="tab-upload"
                class="tab-btn flex-1 py-3 rounded-xl text-sm font-medium transition-all text-gray-600 hover:bg-gray-50">
                <i class="fas fa-file-upload mr-1"></i> 教材管理
            </button>
            <button onclick="switchTab('history')" id="tab-history"
                class="tab-btn flex-1 py-3 rounded-xl text-sm font-medium transition-all text-gray-600 hover:bg-gray-50">
                <i class="fas fa-history mr-1"></i> 提问记录
            </button>
        </div>

        <!-- ── 我的课程 ── -->
        <div id="content-courses" class="tab-content active">
            <!-- 新建课程 -->
            <div class="bg-white rounded-3xl shadow-sm p-6 mb-5 border border-gray-100">
                <h2 class="font-semibold text-lg mb-4">新建课程</h2>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">课程名称</label>
                        <input id="course-name" type="text" placeholder="例如：高等数学"
                            class="w-full px-4 py-3 border border-gray-300 rounded-2xl focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-600 mb-1">课程码（学生用此码加入）</label>
                        <input id="course-key" type="text" placeholder="例如：math101"
                            class="w-full px-4 py-3 border border-gray-300 rounded-2xl focus:outline-none focus:border-blue-500">
                    </div>
                </div>
                <p id="course-msg" class="text-sm mt-2 min-h-[20px]"></p>
                <button onclick="createCourse()"
                    class="mt-1 px-6 py-3 bg-blue-600 text-white rounded-2xl hover:bg-blue-700 font-medium">
                    <i class="fas fa-plus mr-1"></i> 创建课程
                </button>
            </div>

            <!-- 课程列表 -->
            <div class="bg-white rounded-3xl shadow-sm p-6 border border-gray-100">
                <h2 class="font-semibold text-lg mb-4">已创建课程</h2>
                <div id="courses-list"><p class="text-gray-400 text-sm">加载中...</p></div>
            </div>
        </div>

        <!-- ── 教材管理 ── -->
        <div id="content-upload" class="tab-content">
            <div class="bg-white rounded-3xl shadow-sm p-6 border border-gray-100 mb-5">
                <h2 class="font-semibold text-lg mb-4">上传课程 PDF 教材</h2>
                <div class="mb-4">
                    <label class="block text-sm text-gray-600 mb-1">选择课程</label>
                    <select id="upload-course-select" onchange="loadDocuments(this.value)"
                        class="w-full px-4 py-3 border border-gray-300 rounded-2xl focus:outline-none focus:border-blue-500 bg-white">
                        <option value="">-- 请先选择课程 --</option>
                    </select>
                </div>
                <div class="border-2 border-dashed border-gray-300 rounded-3xl p-8 text-center hover:border-blue-300 transition-colors">
                    <i class="fas fa-cloud-upload-alt text-4xl text-gray-400 mb-3"></i>
                    <p class="font-medium mb-2">选择 PDF 文件上传</p>
                    <input id="file-input" type="file" accept=".pdf" class="hidden">
                    <button onclick="document.getElementById('file-input').click()"
                        class="px-6 py-3 bg-blue-600 text-white rounded-2xl hover:bg-blue-700">
                        <i class="fas fa-folder-open mr-1"></i> 选择文件
                    </button>
                    <p id="upload-status" class="mt-3 text-sm min-h-[24px]"></p>
                    <div id="upload-progress" class="hidden mt-2 w-full bg-gray-100 rounded-full h-2">
                        <div id="upload-progress-bar" class="bg-blue-500 h-2 rounded-full transition-all duration-300" style="width:0%"></div>
                    </div>
                </div>
            </div>

    <script src="shared.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('cqa_user') || 'null');
        if (!user?.token || user.role !== 'teacher') location.href = 'login.html';

        const _navAvatarFallback  = `<i class="fas fa-chalkboard-teacher text-blue-400 text-sm"></i>`;
        const _lnavAvatarFallback = `<i class="fas fa-chalkboard-teacher text-white text-lg"></i>`;

        let userProfile = { username: user?.username, role: 'teacher', avatar: null, nickname: null };
        let _pendingAvatar = null;  // base64 预览中但尚未保存的头像

        // ── 头像辅助 ──────────────────────────────────────────────
        function avatarHtml(avatar, sizeClass = 'w-10 h-10', role = 'teacher') {
            if (avatar) {
                return `<img src="${avatar}" class="${sizeClass} rounded-full object-cover border-2 border-white shadow-sm">`;
            }
            const isTeacher = role === 'teacher';
            return `<div class="${sizeClass} ${isTeacher ? 'bg-blue-100 text-blue-500' : 'bg-green-100 text-green-500'} rounded-full flex items-center justify-center">
                <i class="fas ${isTeacher ? 'fa-chalkboard-teacher' : 'fa-user-graduate'} text-base"></i>
            </div>`;
        }

        function displayName(profile) {
            return profile.nickname?.trim() || profile.username;
        }

        // ── 加载个人资料 ──────────────────────────────────────────
        async function loadProfile() {
            const res = await apiFetch(`${API}/api/auth/me`, { headers: authHeaders(), cache: 'no-store' });
            if (!res) return;
            userProfile = await res.json();
            const _cu = JSON.parse(localStorage.getItem('cqa_user') || '{}');
            _cu.avatar = userProfile.avatar;
            _cu.nickname = userProfile.nickname;
            localStorage.setItem('cqa_user', JSON.stringify(_cu));
            updateNavIdentity(displayName(userProfile), userProfile.avatar);
        }

        function switchTab(tab) {
            ['courses', 'upload', 'history'].forEach(t => {
                document.getElementById(`content-${t}`).classList.toggle('active', t === tab);
                document.getElementById(`tab-${t}`).className =
                    'tab-btn flex-1 py-3 rounded-xl text-sm font-medium transition-all ' +
                    (t === tab ? 'bg-blue-600 text-white' : 'text-gray-600 hover:bg-gray-50');
            });
            if (tab === 'upload' || tab === 'history') populateCourseSelects();
        }

        // ── 课程列表 ──────────────────────────────────────────────
        async function loadCourses() {
            const res = await apiFetch(`${API}/api/courses/`, { headers: authHeaders() });
            if (!res) return;
            const data = await res.json();
            _teacherCourses = data;
            const list = document.getElementById('courses-list');
            if (!data.length) { list.innerHTML = '<p class="text-gray-400 text-sm">还没有课程，请先创建</p>'; return; }
            list.innerHTML = data.map(c => `
                <div class="flex items-center justify-between py-3 border-b border-gray-100 last:border-0 group">
                    <div>
                        <p id="name-${c.course_key}" class="font-medium">${c.name}</p>
                        <p class="text-sm text-gray-400">课程码：<span class="font-mono bg-gray-100 px-2 py-0.5 rounded">${c.course_key}</span></p>
                    </div>
                    <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onclick="openMembersModal('${c.course_key}','${c.name.replace(/'/g,'&#39;')}')"
                            class="px-3 py-2 text-green-500 hover:bg-green-50 rounded-xl text-sm border border-green-100" title="查看成员">
                            <i class="fas fa-users"></i>
                        </button>
                        <button onclick="openRename('${c.course_key}','${c.name.replace(/'/g,'&#39;')}')"
                            class="px-3 py-2 text-blue-500 hover:bg-blue-50 rounded-xl text-sm border border-blue-100" title="重命名">
                            <i class="fas fa-pencil-alt"></i>
                        </button>
                        <button onclick="deleteCourse('${c.course_key}','${c.name.replace(/'/g,'&#39;')}')"
                            class="px-3 py-2 text-red-400 hover:bg-red-50 rounded-xl text-sm border border-red-100" title="删除课程">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </div>`).join('');
        }

        async function createCourse() {
            const name = document.getElementById('course-name').value.trim();
            const key  = document.getElementById('course-key').value.trim();
            const msg  = document.getElementById('course-msg');
            if (!name || !key) { msg.className = 'text-sm mt-2 text-red-500'; msg.textContent = '请填写课程名称和课程码'; return; }
            const res = await apiFetch(`${API}/api/courses/`, {
                method: 'POST', headers: authHeaders(),
                body: JSON.stringify({ name, course_key: key })
            });
            if (!res) return;
            const data = await res.json();
            if (!res.ok) { msg.className = 'text-sm mt-2 text-red-500'; msg.textContent = data.detail; return; }
            msg.className = 'text-sm mt-2 text-green-600';
            msg.textContent = `✅ 课程"${name}"创建成功！课程码：${key}`;
            document.getElementById('course-name').value = '';
            document.getElementById('course-key').value = '';
            loadCourses();
        }

        let _renameKey = '';
        function openRename(key, currentName) {
            _renameKey = key;
            document.getElementById('rename-input').value = currentName;
            document.getElementById('modal-rename').classList.remove('hidden');
            setTimeout(() => document.getElementById('rename-input').focus(), 50);
        }
        function closeRename() { document.getElementById('modal-rename').classList.add('hidden'); _renameKey = ''; }
        async function confirmRename() {
            const newName = document.getElementById('rename-input').value.trim();
            if (!newName) return;
            const res = await apiFetch(`${API}/api/courses/${_renameKey}`, {
                method: 'PATCH', headers: authHeaders(),
                body: JSON.stringify({ name: newName })
            });
            if (!res) return;
            closeRename();
            loadCourses();
        }

        async function deleteCourse(key, name) {
            if (!confirm(`删除课程"${name}"（${key}）？\n\n⚠️ 会同时删除所有向量数据和上传文件，无法恢复。`)) return;
            const res = await apiFetch(`${API}/api/courses/${key}`, {
                method: 'DELETE', headers: authHeaders()
            });
            if (!res) return;
            loadCourses();
        }

        // ── 课程成员 ──────────────────────────────────────────────
        let _membersKey = '';
        function openMembersModal(courseKey, courseName) {
            _membersKey = courseKey;
            document.getElementById('members-title').textContent = `课程成员 · ${courseName}`;
            document.getElementById('members-content').innerHTML =
                '<p class="text-gray-400 text-sm text-center py-8">加载中...</p>';
            document.getElementById('modal-members').classList.remove('hidden');
            loadMembers(courseKey);
        }
        function closeMembersModal() { document.getElementById('modal-members').classList.add('hidden'); }

        async function loadMembers(courseKey) {
            const res = await apiFetch(`${API}/api/courses/${courseKey}/students`, { headers: authHeaders() });
            if (!res) return;
            const data = await res.json();
            const content = document.getElementById('members-content');
            if (!data.length) {
                content.innerHTML = `
                    <div class="text-center py-12 text-gray-400">
                        <i class="fas fa-user-graduate text-4xl mb-3 block"></i>
                        <p>还没有学生加入这门课程</p>
                        <p class="text-sm mt-1">学生使用课程码加入后将出现在此处</p>
                    </div>`;
                return;
            }
            content.innerHTML = `
                <p class="text-sm text-gray-500 mb-4">共 ${data.length} 名学生</p>
                <div class="grid grid-cols-3 gap-3">
                    ${data.map(m => `
                        <div class="flex flex-col items-center py-4 px-3 bg-gray-50 rounded-2xl">
                            ${avatarHtml(m.avatar, 'w-14 h-14', 'student')}
                            <p class="font-medium text-sm mt-2 text-center truncate w-full text-gray-800">
                                ${m.nickname?.trim() || m.username}
                            </p>
                            ${m.nickname?.trim() ? `<p class="text-xs text-gray-400 truncate w-full text-center">${m.username}</p>` : ''}
                            <p class="text-xs text-gray-400 mt-1">${m.joined_at?.slice(0,10) || ''}</p>
                            <button onclick="closeMembersModal();openSidebar();openConversation(${m.id},'${(m.nickname?.trim()||m.username).replace(/'/g,'&#39;')}')"
                                class="mt-2 px-3 py-1 bg-blue-50 text-blue-600 text-xs rounded-lg hover:bg-blue-100 border border-blue-100">
                                <i class="fas fa-envelope text-xs mr-1"></i>发消息
                            </button>
                        </div>`).join('')}
                </div>`;
        }

        // ── 教材管理 ──────────────────────────────────────────────
        async function populateCourseSelects() {
            const res = await apiFetch(`${API}/api/courses/`, { headers: authHeaders() });
            if (!res) return;
            const data = await res.json();
            const options = data.map(c => `<option value="${c.course_key}">${c.name}（${c.course_key}）</option>`).join('');
            document.getElementById('upload-course-select').innerHTML = '<option value="">-- 请先选择课程 --</option>' + options;
            document.getElementById('history-course-select').innerHTML = '<option value="">-- 选择课程 --</option>' + options;
            // 若上传 tab 已选中课程，刷新文档列表
            const selected = document.getElementById('upload-course-select').value;
            if (selected) loadDocuments(selected);
        }

        async function loadDocuments(courseKey) {
            const docList = document.getElementById('doc-list');
            if (!courseKey) { docList.innerHTML = '<p class="text-gray-400 text-sm">请先选择课程</p>'; return; }
            docList.innerHTML = '<p class="text-gray-400 text-sm">加载中...</p>';
            const res = await apiFetch(`${API}/api/documents/${courseKey}`, { headers: authHeaders() });
            if (!res) return;
            const data = await res.json();
            if (!data.length) {
                docList.innerHTML = '<p class="text-gray-400 text-sm">该课程还没有上传任何文档</p>';
                return;
            }
            docList.innerHTML = data.map(doc => `
                <div id="doc-${CSS.escape(doc.filename)}" class="flex items-center justify-between py-3 border-b border-gray-100 last:border-0 group">
                    <div class="flex items-center gap-3 min-w-0">
                        <div class="w-9 h-9 bg-red-50 text-red-400 rounded-xl flex items-center justify-center shrink-0">
                            <i class="fas fa-file-pdf"></i>
                        </div>
                        <div class="min-w-0">
                            <p class="font-medium text-sm truncate text-gray-800" title="${doc.display_name}">${doc.display_name}</p>
                            <p class="text-xs text-gray-400">${formatSize(doc.size)}</p>
                        </div>
                    </div>
                    <div class="flex gap-2 shrink-0 ml-3 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onclick="openPdf('${doc.filename.replace(/'/g,"&#39;")}','${doc.display_name.replace(/'/g,"&#39;")}')"
                            class="px-3 py-2 text-blue-400 hover:bg-blue-50 rounded-xl text-sm border border-blue-100">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button onclick="deleteDocument('${courseKey}','${doc.filename.replace(/'/g,"&#39;")}')"
                            class="px-3 py-2 text-red-400 hover:bg-red-50 rounded-xl text-sm border border-red-100">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                </div>`).join('');
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        async function deleteDocument(courseKey, filename) {
            const displayName = filename.slice(courseKey.length + 1);
            if (!confirm(`删除文档《${displayName}》？\n\n该文档的所有向量数据也会一并删除，无法恢复。`)) return;
            const res = await apiFetch(
                `${API}/api/documents/${courseKey}?filename=${encodeURIComponent(filename)}`,
                { method: 'DELETE', headers: authHeaders() }
            );
            if (!res) return;
            loadDocuments(courseKey);
        }

        document.getElementById('file-input').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const courseId = document.getElementById('upload-course-select').value;
            if (!courseId) { alert('请先选择课程'); return; }

            const statusEl = document.getElementById('upload-status');
            const progressWrap = document.getElementById('upload-progress');
            const progressBar = document.getElementById('upload-progress-bar');

            statusEl.textContent = `📤 正在上传 ${file.name}...`;
            statusEl.className = 'mt-3 text-sm text-gray-500';
            progressWrap.classList.remove('hidden');
            progressBar.style.width = '0%';

            const formData = new FormData();
            formData.append('file', file);
            formData.append('course_id', courseId);

            let res;
            try {
                res = await fetch(`${API}/api/upload`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${user.token}` },
                    body: formData,
                });
            } catch {
                statusEl.className = 'mt-3 text-sm text-red-500';
                statusEl.textContent = '❌ 网络错误，请重试';
                progressWrap.classList.add('hidden');
                e.target.value = '';
                return;
            }
            if (res.status === 401) { localStorage.removeItem('cqa_user'); location.href = 'login.html'; return; }
            if (!res.ok) {
                statusEl.className = 'mt-3 text-sm text-red-500';
                statusEl.textContent = '❌ 上传失败';
                progressWrap.classList.add('hidden');
                e.target.value = '';
                return;
            }

            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let totalPages = 0;

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                let idx;
                while ((idx = buffer.indexOf('\n\n')) !== -1) {
                    const block = buffer.slice(0, idx);
                    buffer = buffer.slice(idx + 2);
                    for (const line of block.split('\n')) {
                        if (!line.startsWith('data: ')) continue;
                        let evt;
                        try { evt = JSON.parse(line.slice(6)); } catch { continue; }
                        if (evt.type === 'start') {
                            totalPages = evt.total;
                            statusEl.textContent = `📄 开始处理《${evt.filename}》，共 ${totalPages} 页...`;
                        } else if (evt.type === 'progress') {
                            const pct = totalPages > 0 ? Math.round(evt.current / totalPages * 100) : 0;
                            progressBar.style.width = pct + '%';
                            statusEl.textContent = `⚙️ 正在提取第 ${evt.current} 页 / 共 ${totalPages} 页...`;
                        } else if (evt.type === 'vectorizing') {
                            progressBar.style.width = '0%';
                            statusEl.textContent = `🧠 正在向量化，共 ${evt.total} 个文本块...`;
                        } else if (evt.type === 'embed_progress') {
                            const pct = evt.total > 0 ? Math.round(evt.done / evt.total * 100) : 100;
                            progressBar.style.width = pct + '%';
                            statusEl.textContent = `🧠 向量化中... ${evt.done} / ${evt.total} 块`;
                        } else if (evt.type === 'done') {
                            progressBar.style.width = '100%';
                            statusEl.className = 'mt-3 text-sm text-green-600';
                            statusEl.textContent = evt.message;
                            setTimeout(() => progressWrap.classList.add('hidden'), 2000);
                            loadDocuments(courseId);
                        } else if (evt.type === 'error') {
                            statusEl.className = 'mt-3 text-sm text-red-500';
                            statusEl.textContent = evt.message;
                            progressWrap.classList.add('hidden');
                        }
                    }
                }
            }
            e.target.value = '';
        });

        // ── 提问记录 ──────────────────────────────────────────────
        async function loadHistory() {
            const key  = document.getElementById('history-course-select').value;
            const list = document.getElementById('history-list');
            if (!key) { list.innerHTML = '<p class="text-gray-400 text-sm">请先选择课程</p>'; return; }
            list.innerHTML = '<p class="text-gray-400 text-sm">加载中...</p>';
            const res = await apiFetch(`${API}/api/history/${key}`, { headers: authHeaders() });
            if (!res) return;
            const data = await res.json();
            renderHistoryList(data);
        }

        function renderHistoryList(data) {
            const list = document.getElementById('history-list');
            if (!data.length) { list.innerHTML = '<p class="text-gray-400 text-sm">该课程暂无提问记录</p>'; return; }
            const byDate = {};
            data.forEach(r => { const d = (r.created_at||'').slice(0,10) || '未知日期'; (byDate[d] = byDate[d]||[]).push(r); });
            list.innerHTML = Object.entries(byDate).map(([date, logs]) => `
                <div class="mb-4">
                    <div class="flex items-center gap-3 mb-2 px-1">
                        <span class="text-xs font-medium text-gray-400">${date}</span>
                        <div class="flex-1 h-px bg-gray-100"></div>
                    </div>
                    ${logs.map(r => `
                    <div id="log-${r.id}" class="border border-gray-100 rounded-2xl p-4 mb-2 group">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-sm font-medium text-blue-700">👤 ${r.student_name}</span>
                            <div class="flex items-center gap-3">
                                <span class="text-xs text-gray-400">${(r.created_at||'').slice(11,16)}</span>
                                <button onclick="deleteLog(${r.id})"
                                    class="text-gray-300 hover:text-red-400 opacity-0 group-hover:opacity-100 transition-opacity text-sm">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </div>
                        </div>
                        <p class="text-gray-800 font-medium mb-1">❓ ${r.question}</p>
                        ${r.answer ? `<p class="text-gray-600 text-sm bg-blue-50 rounded-xl p-3 mt-2 leading-relaxed">💡 ${r.answer}</p>` : ''}
                    </div>`).join('')}
                </div>`).join('');
        }

        async function deleteLog(id) {
            if (!confirm('删除这条提问记录？')) return;
            const res = await apiFetch(`${API}/api/history/log/${id}`, {
                method: 'DELETE', headers: authHeaders()
            });
            if (!res) return;
            document.getElementById(`log-${id}`)?.remove();
        }

        // ── 个人设置 ──────────────────────────────────────────────
        function openProfileModal() {
            _pendingAvatar = null;
            document.getElementById('nickname-input').value = userProfile.nickname || '';
            document.getElementById('profile-msg').textContent = '';
            // 设置头像预览
            const preview = document.getElementById('profile-avatar-preview');
            preview.innerHTML = userProfile.avatar
                ? `<img src="${userProfile.avatar}" class="w-full h-full object-cover rounded-full">`
                : `<i class="fas fa-chalkboard-teacher text-blue-300 text-4xl"></i>`;
            document.getElementById('modal-profile').classList.remove('hidden');
        }
        document.getElementById('avatar-input').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            try {
                _pendingAvatar = await resizeImageToBase64(file, 200);
                const preview = document.getElementById('profile-avatar-preview');
                preview.innerHTML = `<img src="${_pendingAvatar}" class="w-full h-full object-cover rounded-full">`;
            } catch {
                document.getElementById('profile-msg').textContent = '图片读取失败，请重试';
            }
            e.target.value = '';
        });

        async function saveProfile() {
            const nickname = document.getElementById('nickname-input').value.trim() || null;
            const body = { nickname };
            if (_pendingAvatar !== null) body.avatar = _pendingAvatar;
            const res = await apiFetch(`${API}/api/auth/profile`, {
                method: 'PUT', headers: authHeaders(),
                body: JSON.stringify(body)
            });
            if (!res) return;
            const msg = document.getElementById('profile-msg');
            if (!res.ok) { msg.className = 'text-sm mb-3 text-red-500'; msg.textContent = '保存失败'; return; }
            if (body.avatar !== undefined) userProfile.avatar = body.avatar;
            userProfile.nickname = nickname;
            msg.className = 'text-sm mb-3 text-green-600';
            msg.textContent = '✅ 已保存';
            updateNavIdentity(displayName(userProfile), userProfile.avatar);
            setTimeout(closeProfileModal, 800);
        }

        async function confirmDeleteAccount() {
            if (!confirm('确认注销账号？\n\n此操作不可恢复，您的账号及所有相关课程数据将被永久删除。')) return;
            const res = await apiFetch(`${API}/api/auth/account`, { method: 'DELETE', headers: authHeaders() });
            if (!res) return;
            if (!res.ok) { alert('注销失败，请重试'); return; }
            localStorage.removeItem('cqa_user');
            location.href = 'login.html';
        }

        // ── PDF 预览 ──────────────────────────────────────────────
        function openPdf(filename, displayName) {
            const url = `${API}/pdfs/${encodeURIComponent(filename)}`;
            document.getElementById('pdf-modal-title').textContent = displayName;
            const embed = document.getElementById('pdf-embed');
            embed.src = '';
            requestAnimationFrame(() => { embed.src = url; });
            document.getElementById('modal-pdf').classList.remove('hidden');
        }
        function closePdf() {
            document.getElementById('modal-pdf').classList.add('hidden');
            document.getElementById('pdf-embed').src = '';
        }

        // ── 左导航栏 ──────────────────────────────────────────────
        let _navCollapsed = false;
        let _activePage = 'courses';
        let _lastUnreadCount = -1;
        let _msgPollTimer = null;
        let _currentConvUserId = null;
        let _currentConvUserName = null;
        let _currentGroupId = null;
        let _currentGroupName = null;
        let _notesFilterKey = null;
        let _allPublicNotes = [];
        let _teacherCourses = [];

        function navigateTo(page) {
            _activePage = page;
            ['msgs', 'notes', 'settings'].forEach(p => document.getElementById(`page-${p}`)?.classList.add('hidden'));
            if (page === 'courses') {
                document.getElementById('page-courses').classList.remove('hidden');
                refreshCalendar();
            } else {
                document.getElementById('page-courses').classList.add('hidden');
                document.getElementById(`page-${page}`).classList.remove('hidden');
                if (page === 'msgs') { loadConversations(); }
                else if (page === 'notes') loadPublicNotes();
                else if (page === 'settings') loadProfile().then(loadSettingsPage);
            }
            ['courses', 'msgs', 'notes', 'settings'].forEach(p => {
                const btn = document.getElementById(`lnav-${p}-btn`);
                if (!btn) return;
                btn.classList.toggle('bg-white/20', p === page);
                btn.classList.toggle('text-white', p === page);
                btn.classList.toggle('text-white/70', p !== page);
            });
        }

        // ── 消息 ──────────────────────────────────────────────────
        async function loadConversations() {
            const listEl = document.getElementById('conversations-list');
            listEl.innerHTML = '<p class="text-gray-400 text-xs text-center py-4">加载中...</p>';
            try {
                const res = await apiFetch(`${API}/api/messages/conversations`, { headers: authHeaders() });
                if (!res) return;
                const data = await res.json();
                renderConversations(data);
            } catch {}
        }

        // ── 学生公开笔记 ──────────────────────────────────────────
        async function loadPublicNotes() {
            const gridEl = document.getElementById('public-notes-grid');
            if (!gridEl) return;
            gridEl.innerHTML = '<p class="col-span-full text-gray-400 text-sm text-center py-12">加载中...</p>';
            try {
                const res = await apiFetch(`${API}/api/notes/public`, { headers: authHeaders() });
                if (!res) return;
                _allPublicNotes = await res.json();
                applyPublicNotesFilter();
            } catch {}
        }

        function applyPublicNotesFilter() {
            const notes = _notesFilterKey
                ? _allPublicNotes.filter(n => n.course_key === _notesFilterKey)
                : _allPublicNotes;
            renderPublicNotes(notes);
        }

        async function buildTeacherNotesFilterDropdown() {
            if (!_teacherCourses.length) {
                const res = await apiFetch(`${API}/api/courses/`, { headers: authHeaders() });
                if (res) _teacherCourses = await res.json();
            }
            const list = document.getElementById('notes-filter-list');
            if (!list) return;
            const MAX_SHOW = 10;
            const hasMore = _teacherCourses.length > MAX_SHOW;
            const shown = _teacherCourses.slice(0, MAX_SHOW);
            const check = key => key === _notesFilterKey
                ? '<i class="fas fa-check text-blue-500 text-xs shrink-0"></i>' : '';
            list.innerHTML = `
                <div onclick="selectNotesFilter(null,'全部')" class="px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 cursor-pointer flex items-center justify-between rounded-xl mx-1">
                    <span>全部</span>${check(null)}
                </div>
                ${shown.map(c => `
                <div onclick="selectNotesFilter('${c.course_key}','${c.name.replace(/'/g,'&#39;')}')"
                    class="px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 cursor-pointer flex items-center justify-between rounded-xl mx-1">
                    <span class="truncate mr-2">${c.name}</span>${check(c.course_key)}
                </div>`).join('')}
                ${hasMore ? `<div onclick="openCourseFilterModal()"
                    class="px-4 py-2.5 text-sm text-blue-500 hover:bg-blue-50 cursor-pointer flex items-center gap-2 rounded-xl mx-1 border-t border-gray-100 mt-1 pt-3">
                    <i class="fas fa-ellipsis-h text-xs"></i> 更多课程
                </div>` : ''}`;
        }

        async function toggleNotesFilter() {
            const dd = document.getElementById('notes-filter-dropdown');
            if (dd.classList.contains('hidden')) {
                await buildTeacherNotesFilterDropdown();
                dd.classList.remove('hidden');
            } else {
                dd.classList.add('hidden');
            }
        }

        function selectNotesFilter(key, name) {
            _notesFilterKey = key;
            const labelEl = document.getElementById('notes-filter-label');
            if (labelEl) labelEl.textContent = name;
            document.getElementById('notes-filter-dropdown')?.classList.add('hidden');
            document.getElementById('modal-course-filter')?.classList.add('hidden');
            applyPublicNotesFilter();
        }

        async function openCourseFilterModal() {
            document.getElementById('notes-filter-dropdown')?.classList.add('hidden');
            if (!_teacherCourses.length) {
                const res = await apiFetch(`${API}/api/courses/`, { headers: authHeaders() });
                if (res) _teacherCourses = await res.json();
            }
            const list = document.getElementById('modal-course-filter-list');
            if (!list) return;
            const sel = key => _notesFilterKey === key
                ? 'border-blue-400 bg-blue-50 text-blue-700 font-medium'
                : 'border-gray-200 hover:border-blue-300 text-gray-700';
            list.innerHTML = `
                <div onclick="selectNotesFilter(null,'全部')" class="p-3 rounded-xl border-2 cursor-pointer text-sm ${sel(null)}">全部</div>
                ${_teacherCourses.map(c => `
                <div onclick="selectNotesFilter('${c.course_key}','${c.name.replace(/'/g,'&#39;')}')"
                    class="p-3 rounded-xl border-2 cursor-pointer text-sm ${sel(c.course_key)}">${c.name}</div>`).join('')}`;
            document.getElementById('modal-course-filter').classList.remove('hidden');
        }

        function renderPublicNotes(notes) {
            const gridEl = document.getElementById('public-notes-grid');
            if (!gridEl) return;
            const countEl = document.getElementById('notes-count-text');
            if (countEl) countEl.textContent = notes.length ? `共 ${notes.length} 条公开笔记` : '暂无公开笔记';
            if (!notes.length) {
                gridEl.innerHTML = `
                    <div class="col-span-full text-center py-16 text-gray-400">
                        <i class="fas fa-book-open text-5xl mb-4 block text-gray-200"></i>
                        <p class="text-base font-medium text-gray-500">暂无公开笔记</p>
                        <p class="text-sm mt-1">学生将笔记设为公开后将在此显示</p>
                    </div>`;
                return;
            }
            gridEl.innerHTML = notes.map((n, i) => {
                const docLabel = n.doc_name === 'AI问答归整'
                    ? '✨ AI问答归整'
                    : `${n.doc_name.replace(/^[^_]+_/, '')} · 第${n.page_num}页`;
                const color = NOTE_COLORS[i % NOTE_COLORS.length];
                const studentName = n.student_nickname?.trim() || n.student_name;
                return `
                <div class="bg-white rounded-2xl shadow-sm hover:shadow-md transition-shadow overflow-hidden flex flex-col">
                    <div class="h-1.5 bg-gradient-to-r ${color}"></div>
                    <div class="p-4 flex-1">
                        <div class="flex items-center gap-2 mb-2">
                            <div class="w-7 h-7 bg-green-100 text-green-600 rounded-full flex items-center justify-center shrink-0">
                                <i class="fas fa-user-graduate text-xs"></i>
                            </div>
                            <span class="text-sm font-medium text-gray-800 truncate">${studentName}</span>
                            <span class="ml-auto text-xs bg-gray-100 text-gray-500 px-2 py-0.5 rounded-lg shrink-0 truncate max-w-[45%]">${docLabel}</span>
                        </div>
                        <div class="flex items-center gap-2 mb-1.5">
                            ${n.title ? `<p class="text-sm font-semibold text-gray-800 truncate flex-1">${n.title}</p>` : '<span class="flex-1"></span>'}
                            ${n.is_ai ? `<span class="shrink-0 text-xs px-1.5 py-0.5 bg-purple-100 text-purple-600 rounded font-medium flex items-center gap-0.5"><i class="fas fa-robot text-[9px]"></i> AI</span>` : ''}
                        </div>
                        <p class="text-sm text-gray-700 leading-relaxed" style="-webkit-line-clamp:4;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden">${n.content}</p>
                    </div>
                    <div class="px-4 py-3 border-t border-gray-100">
                        <div class="flex items-center gap-2">
                            <input type="text" id="comment-input-${n.id}" placeholder="添加评论..."
                                class="flex-1 text-xs px-3 py-2 border border-gray-200 rounded-xl focus:outline-none focus:border-blue-400 bg-gray-50">
                            <button onclick="submitComment(${n.id})"
                                class="text-xs px-3 py-2 bg-blue-600 text-white rounded-xl hover:bg-blue-700 whitespace-nowrap font-medium">回复</button>
                        </div>
                        <button onclick="loadTeacherNoteComments(${n.id})" class="text-xs text-blue-500 hover:text-blue-700 mt-2 flex items-center gap-1">
                            <i class="fas fa-comment-alt text-xs"></i> 查看评论
                        </button>
                        <div id="tnotes-comments-${n.id}" class="hidden mt-2 space-y-1.5"></div>
                    </div>
                </div>`;
            }).join('');
        }

        async function loadTeacherNoteComments(noteId) {
            const el = document.getElementById(`tnotes-comments-${noteId}`);
            if (!el) return;
            if (!el.classList.contains('hidden') && el.dataset.loaded) {
                el.classList.add('hidden');
                return;
            }
            el.classList.remove('hidden');
            el.innerHTML = '<p class="text-xs text-gray-400 text-center py-1">加载中...</p>';
            try {
                const res = await apiFetch(`${API}/api/notes/${noteId}/comments`, { headers: authHeaders() });
                if (!res) return;
                const comments = await res.json();
                el.dataset.loaded = '1';
                el.innerHTML = comments.length
                    ? comments.map(c => `
                        <div class="text-xs text-gray-600 bg-blue-50 rounded-lg px-3 py-1.5">
                            <span class="font-medium text-blue-700">${c.teacher_nickname?.trim()||c.teacher_name}</span>：${c.content}
                        </div>`).join('')
                    : '<p class="text-xs text-gray-400">暂无评论</p>';
            } catch {}
        }

        async function submitComment(noteId) {
            const input = document.getElementById(`comment-input-${noteId}`);
            const content = input?.value.trim();
            if (!content) return;
            input.value = '';
            try {
                await apiFetch(`${API}/api/notes/${noteId}/comments`, {
                    method: 'POST', headers: authHeaders(),
                    body: JSON.stringify({ content })
                });
                loadTeacherNoteComments(noteId);
            } catch {}
        }

        // ── 键盘 / 背景点击关闭 ──────────────────────────────────
        document.getElementById('rename-input').addEventListener('keypress', e => { if (e.key === 'Enter') confirmRename(); });
        document.getElementById('modal-pdf').addEventListener('click', e => { if (e.target === e.currentTarget) closePdf(); });
        document.getElementById('modal-course-filter').addEventListener('click', e => { if (e.target === e.currentTarget) closeCourseFilterModal(); });
        document.addEventListener('click', e => {
            const wrap = document.getElementById('notes-filter-wrap');
            if (wrap && !wrap.contains(e.target)) document.getElementById('notes-filter-dropdown')?.classList.add('hidden');
        });
        document.getElementById('modal-partner-profile').addEventListener('click', e => { if (e.target === e.currentTarget) closePartnerProfile(); });
        document.getElementById('modal-history-picker').addEventListener('click', e => { if (e.target === e.currentTarget) closeHistoryPicker(); });
        document.getElementById('modal-group-members').addEventListener('click', e => { if (e.target === e.currentTarget) closeGroupMembersList(); });
        document.getElementById('modal-schedule-day').addEventListener('click', e => { if (e.target === e.currentTarget) closeScheduleModal(); });
        ['modal-rename', 'modal-profile', 'modal-members'].forEach(id => {
            document.getElementById(id).addEventListener('click', e => {
                if (e.target === e.currentTarget) {
                    if (id === 'modal-rename') closeRename();
                    else if (id === 'modal-profile') closeProfileModal();
                    else closeMembersModal();
                }
            });
        });
        document.getElementById('msg-input').addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMessage(); }
        });
        document.getElementById('msg-input').addEventListener('input', e => {
            e.target.style.height = 'auto';
            e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
        });
        document.getElementById('group-msg-input').addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendGroupMessage(); }
        });
        document.getElementById('group-msg-input').addEventListener('input', e => {
            e.target.style.height = 'auto';
            e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
        });
        document.addEventListener('click', e => {
            if (!e.target.closest('#conv-menu-btn') && !e.target.closest('#conv-menu-dropdown')) closeConvMenu();
            if (!e.target.closest('#group-menu-btn') && !e.target.closest('#group-menu-dropdown')) closeGroupMenu();
        });

        // ── 初始化 ────────────────────────────────────────────────
        loadSavedTheme();
        loadSavedDark();
        updateNavIdentity(user?.nickname?.trim() || user?.username || '', user?.avatar || null);
        loadProfile();
        loadCourses();
        initCalendar();
        checkScheduleNotifications();
        startMsgPoll();
    </script>
</body>
</html>
