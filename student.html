    <style>
        body { font-family: "Microsoft YaHei", system-ui, sans-serif; }
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        .chevron { transition: transform 0.2s; display: inline-block; }
        details[open] summary .chevron { transform: rotate(90deg); }
        .result-card { transition: transform 0.2s, box-shadow 0.2s; }
        .result-card:hover { transform: translateY(-2px); box-shadow: 0 12px 24px -4px rgb(0 0 0 / 0.08); }
        @keyframes blink { 50% { opacity: 0; } }
        .stream-cursor { animation: blink 1s step-end infinite; }
        .md-answer ul { list-style-type: disc; padding-left: 1.5em; margin: 0.4em 0; }
        .md-answer ol { list-style-type: decimal; padding-left: 1.5em; margin: 0.4em 0; }
        .md-answer li { margin: 0.2em 0; }
        .md-answer p { margin: 0.4em 0; }
        .md-answer p:first-child { margin-top: 0; }
        .md-answer strong { font-weight: 600; }

<body class="bg-gray-50 min-h-screen">

    <!-- ══════════════════════ 左侧导航栏 ══════════════════════ -->
    <div id="left-nav" class="fixed left-0 top-0 h-full bg-gray-900 flex flex-col overflow-hidden" style="width:200px;transition:width 0.25s;z-index:35">
        <div class="flex flex-col items-center py-5 px-3 border-b border-white/10 shrink-0">
            <div id="lnav-avatar" class="w-12 h-12 rounded-full overflow-hidden bg-green-800 flex items-center justify-center mb-2 shrink-0">
                <i class="fas fa-user-graduate text-white text-lg"></i>
            </div>
            <span id="lnav-username" class="lnav-label text-white/80 text-sm font-medium truncate w-full text-center leading-tight mt-1"></span>
        </div>
        <nav class="flex-1 py-2">
            <button id="lnav-courses-btn" onclick="navigateTo('courses')"
                class="lnav-item w-full flex items-center gap-3 px-4 py-3.5 text-white bg-white/20 hover:bg-white/25 transition-colors">
                <i class="fas fa-book text-base shrink-0"></i>
                <span class="lnav-label text-sm whitespace-nowrap">我的课程</span>
            </button>
            <button id="lnav-msgs-btn" onclick="navigateTo('msgs')"
                class="lnav-item w-full flex items-center gap-3 px-4 py-3.5 text-white/70 hover:bg-white/10 hover:text-white transition-colors relative">
                <i class="fas fa-envelope text-base shrink-0"></i>
                <span class="lnav-label text-sm whitespace-nowrap">消息</span>
                <span id="msg-badge" class="hidden absolute top-2.5 left-7 min-w-[16px] h-4 bg-red-500 text-white text-[9px] font-bold rounded-full flex items-center justify-center px-1"></span>
            </button>
            <button id="lnav-notes-btn" onclick="navigateTo('notes')"
                class="lnav-item w-full flex items-center gap-3 px-4 py-3.5 text-white/70 hover:bg-white/10 hover:text-white transition-colors">
                <i class="fas fa-book-open text-base shrink-0"></i>
                <span class="lnav-label text-sm whitespace-nowrap">我的笔记</span>
            </button>
            <button id="lnav-settings-btn" onclick="navigateTo('settings')"
                class="lnav-item w-full flex items-center gap-3 px-4 py-3.5 text-white/70 hover:bg-white/10 hover:text-white transition-colors">
                <i class="fas fa-cog text-base shrink-0"></i>
                <span class="lnav-label text-sm whitespace-nowrap">设置</span>
            </button>
        </nav>
        <button onclick="toggleNavCollapse()"
            class="shrink-0 w-full flex items-center px-4 py-3 text-white/40 hover:text-white/70 border-t border-white/10 transition-colors">
            <span id="nav-collapse-label" class="lnav-label text-xs mr-auto">收起</span>
            <i id="nav-collapse-icon" class="fas fa-angle-double-left text-xs" style="transition:transform 0.25s"></i>
        </button>
    </div>

    <!-- ══════════════════════ 主内容区 ══════════════════════ -->
    <div id="main-wrap" style="margin-left:200px;transition:margin-left 0.25s">

    <!-- 顶栏 -->
    <div class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between sticky top-0 z-10">
        <div class="flex items-center gap-3">
            <span class="text-blue-600 font-bold text-xl">CourseQA</span>
            <span class="bg-green-100 text-green-700 text-xs px-2 py-1 rounded-full font-medium">学生端</span>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="openProfileModal()" id="nav-profile-btn"
                class="flex items-center gap-2 hover:opacity-80 transition-opacity cursor-pointer group">
                <div id="nav-avatar" class="w-9 h-9 rounded-full overflow-hidden border-2 border-green-200 flex items-center justify-center bg-green-50 shrink-0">
                    <i class="fas fa-user-graduate text-green-400 text-sm"></i>
                </div>
                <span id="username-display" class="text-gray-700 text-sm font-medium group-hover:text-green-600 transition-colors"></span>
                <i class="fas fa-pen text-gray-300 text-xs group-hover:text-green-400 transition-colors"></i>
            </button>
            <button onclick="logout()" class="text-sm text-gray-400 hover:text-red-500 flex items-center gap-1 ml-1">
                <i class="fas fa-sign-out-alt"></i> 退出
            </button>
        </div>
    </div>

    <!-- ══════════════════════ 课程选择页 ══════════════════════ -->
    <div id="page-courses" class="flex items-start">
        <!-- 左侧：课程内容 -->
        <div class="flex-1 min-w-0 p-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-5">我的课程</h2>

            <div id="course-notice" class="hidden mb-4 px-4 py-3 bg-amber-50 border border-amber-200 text-amber-800 rounded-2xl text-sm flex items-center gap-2">
                <i class="fas fa-exclamation-triangle text-amber-500 shrink-0"></i>
                <span id="course-notice-text"></span>
            </div>

            <div id="saved-courses-section">
                <div id="saved-courses-list" class="space-y-3 mb-5"></div>
            </div>

            <!-- 加入新课程 -->
            <div id="join-section" class="bg-white rounded-3xl border border-gray-100 shadow-sm overflow-hidden">
                <button onclick="toggleJoinForm()" id="join-toggle-btn"
                    class="w-full px-6 py-4 flex items-center justify-between text-left hover:bg-gray-50 transition-colors">
                    <span class="flex items-center gap-2 font-medium text-gray-700">
                        <i class="fas fa-plus-circle text-blue-500"></i> 加入新课程
                    </span>
                    <i id="join-toggle-icon" class="fas fa-chevron-down text-gray-400 text-sm transition-transform"></i>
                </button>
                <div id="join-form" class="hidden px-6 pb-5 pt-1 border-t border-gray-100">
                    <div class="flex gap-3 mt-3">
                        <input id="course-key-input" type="text" placeholder="输入课程码，例如 math101"
                            class="flex-1 px-4 py-3 border border-gray-300 rounded-2xl focus:outline-none focus:border-blue-500">
                        <button onclick="joinCourse()"
                            class="px-6 py-3 bg-blue-600 text-white rounded-2xl hover:bg-blue-700 font-medium">
                            加入
                        </button>
                    </div>
                    <p id="join-msg" class="text-sm mt-2 min-h-[20px]"></p>
                </div>
            </div>
        </div><!-- /左侧课程内容 -->

        <!-- 右侧：日历 -->
        <div id="cal-sidebar" class="w-64 shrink-0 border-l border-gray-100 bg-white overflow-y-auto" style="position:sticky;top:65px;max-height:calc(100vh - 65px)">
            <!-- 月份导航（固定在顶部） -->
            <div class="cal-sticky-header sticky top-0 z-10 bg-white border-b border-gray-100 px-3 py-2">
                <div class="flex items-center justify-between">
                    <button onclick="prevCalMonth()" class="w-7 h-7 flex items-center justify-center rounded-lg hover:bg-gray-100 text-gray-500">
                        <i class="fas fa-chevron-left text-xs"></i>
                    </button>
                    <span id="cal-month-label" class="text-sm font-semibold text-gray-700"></span>
                    <button onclick="nextCalMonth()" class="w-7 h-7 flex items-center justify-center rounded-lg hover:bg-gray-100 text-gray-500">
                        <i class="fas fa-chevron-right text-xs"></i>
                    </button>
                </div>
                <p class="text-center text-[10px] text-gray-400 mt-1">双击具体日期以设置日程</p>
            </div>
            <!-- 日期列表（JS renderCalendar() 填充） -->
            <div id="cal-grid" class="px-2 py-1"></div>
        </div><!-- /右侧日历 -->
    </div>

    <!-- ══════════════════════ 提问页 ══════════════════════ -->
    <div id="page-qa" class="hidden flex" style="height:calc(100vh - 65px)">
        <!-- 左侧：提问区 -->

    <div id="modal-note-viewer" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4" style="backdrop-filter:blur(2px)">

    <!-- ══ 个人设置弹窗（头像 + 昵称） ══ -->
    <div id="modal-profile" class="hidden fixed inset-0 z-40 bg-black/30 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm p-6">
            <div class="flex items-center justify-between mb-5">
                <h3 class="font-semibold text-lg">个人设置</h3>
                <button onclick="closeProfileModal()" class="text-gray-400 hover:text-gray-600 w-8 h-8 flex items-center justify-center rounded-xl hover:bg-gray-100">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <!-- 头像预览 -->
            <div class="flex flex-col items-center mb-5">
                <div id="profile-avatar-preview" onclick="document.getElementById('avatar-input').click()"
                    class="w-24 h-24 rounded-full overflow-hidden border-4 border-green-100 cursor-pointer hover:opacity-80 transition-opacity relative flex items-center justify-center bg-green-50">
                    <i class="fas fa-user-graduate text-green-300 text-4xl"></i>
                    <div class="absolute inset-0 bg-black/0 hover:bg-black/10 rounded-full transition-colors flex items-center justify-center">
                        <i class="fas fa-camera text-white opacity-0 hover:opacity-100 text-xl"></i>
                    </div>
                </div>
                <input id="avatar-input" type="file" accept="image/*" class="hidden">
                <p class="text-xs text-gray-400 mt-2">点击头像更换图片</p>
            </div>
            <!-- 昵称 -->
            <div class="mb-5">
                <label class="block text-sm text-gray-600 mb-1">昵称</label>
                <input id="nickname-input" type="text" placeholder="留空则显示用户名"
                    class="w-full px-4 py-3 border border-gray-300 rounded-2xl focus:outline-none focus:border-blue-500">
                <p class="text-xs text-gray-400 mt-1">昵称会展示给任课教师查看</p>
            </div>
            <p id="profile-msg" class="text-sm mb-3 min-h-[20px]"></p>
            <button onclick="saveProfile()"
                class="w-full py-3 bg-blue-600 text-white rounded-2xl hover:bg-blue-700 font-medium">
                <i class="fas fa-save mr-1"></i> 保存设置
            </button>
            <p class="text-xs text-gray-400 text-center mt-3">
                密码修改和账号注销请前往
                <button onclick="closeProfileModal();navigateTo('settings')" class="text-blue-500 hover:underline">设置页面</button>
            </p>
        </div>

    <script src="shared.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('cqa_user') || 'null');
        if (!user?.token || user.role !== 'student') location.href = 'login.html';

        const COURSES_KEY = `cqa_courses_${user.username}`;

        const _navAvatarFallback  = `<i class="fas fa-user-graduate text-green-400 text-sm"></i>`;
        const _lnavAvatarFallback = `<i class="fas fa-user-graduate text-white text-lg"></i>`;

        let userProfile = { username: user?.username, role: 'student', avatar: null, nickname: null };
        let _pendingAvatar = null;
        let _navCollapsed = false;
        let _activePage = 'courses';
        let _lastUnreadCount = -1;
        let _msgPollTimer = null;
        let _currentConvUserId = null;
        let _currentConvUserName = null;
        let _currentGroupId = null;
        let _currentGroupName = null;
        let _currentDocFilename = null;
        let _lastAiAnswer = '';
        let _lastAiQuestion = '';
        let _studentNotes = [];
        let _notesCourseFilterKey = null;
        let _editingNoteId = null;
        let _noteOrigTitle = '';
        let _noteOrigContent = '';

        // ── 头像辅助 ──────────────────────────────────────────────
        function avatarHtml(avatar, sizeClass = 'w-10 h-10', role = 'student') {
            if (avatar) {
                return `<img src="${avatar}" class="${sizeClass} rounded-full object-cover border-2 border-white shadow-sm">`;
            }
            const isTeacher = role === 'teacher';
            return `<div class="${sizeClass} ${isTeacher ? 'bg-blue-100 text-blue-500' : 'bg-green-100 text-green-500'} rounded-full flex items-center justify-center">
                <i class="fas ${isTeacher ? 'fa-chalkboard-teacher' : 'fa-user-graduate'} text-base"></i>
            </div>`;
        }

        // ── 加载个人资料 ──────────────────────────────────────────
        async function loadProfile() {
            const res = await apiFetch(`${API}/api/auth/me`, { headers: authHeaders(), cache: 'no-store' });
            if (!res) return;
            userProfile = await res.json();
            const _cu = JSON.parse(localStorage.getItem('cqa_user') || '{}');
            _cu.avatar = userProfile.avatar;
            _cu.nickname = userProfile.nickname;
            localStorage.setItem('cqa_user', JSON.stringify(_cu));
            updateNavIdentity(displayName(userProfile), userProfile.avatar);
        }

        // ── 个人设置弹窗 ──────────────────────────────────────────
        function openProfileModal() {
            _pendingAvatar = null;
            document.getElementById('nickname-input').value = userProfile.nickname || '';
            document.getElementById('profile-msg').textContent = '';
            const preview = document.getElementById('profile-avatar-preview');
            preview.innerHTML = userProfile.avatar
                ? `<img src="${userProfile.avatar}" class="w-full h-full object-cover rounded-full">`
                : `<i class="fas fa-user-graduate text-green-300 text-4xl"></i>`;
            document.getElementById('modal-profile').classList.remove('hidden');
        }

        document.getElementById('avatar-input').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            try {
                _pendingAvatar = await resizeImageToBase64(file, 200);
                document.getElementById('profile-avatar-preview').innerHTML =
                    `<img src="${_pendingAvatar}" class="w-full h-full object-cover rounded-full">`;
            } catch {
                document.getElementById('profile-msg').textContent = '图片读取失败，请重试';
            }
            e.target.value = '';
        });

        async function saveProfile() {
            const nickname = document.getElementById('nickname-input').value.trim() || null;
            const body = { nickname };
            if (_pendingAvatar !== null) body.avatar = _pendingAvatar;
            const res = await apiFetch(`${API}/api/auth/profile`, {
                method: 'PUT', headers: authHeaders(),
                body: JSON.stringify(body)
            });
            if (!res) return;
            const msg = document.getElementById('profile-msg');
            if (!res.ok) { msg.className = 'text-sm mb-3 text-red-500'; msg.textContent = '保存失败'; return; }
            if (body.avatar !== undefined) userProfile.avatar = body.avatar;
            userProfile.nickname = nickname;
            msg.className = 'text-sm mb-3 text-green-600';
            msg.textContent = '✅ 已保存';
            updateNavIdentity(displayName(userProfile), userProfile.avatar);
            setTimeout(closeProfileModal, 800);
        }

        async function confirmDeleteAccount() {
            if (!confirm('确认注销账号？\n\n此操作不可恢复，您的账号及所有相关数据将被永久删除。')) return;
            const res = await apiFetch(`${API}/api/auth/account`, { method: 'DELETE', headers: authHeaders() });
            if (!res) return;
            if (!res.ok) { alert('注销失败，请重试'); return; }
            localStorage.removeItem('cqa_user');
            localStorage.removeItem(COURSES_KEY);
            location.href = 'login.html';
        }

        // ── 导航 ──────────────────────────────────────────────────
        function navigateTo(page) {
            _activePage = page;
            ['page-courses', 'page-qa', 'page-msgs', 'page-notes', 'page-settings'].forEach(id => {
                document.getElementById(id)?.classList.add('hidden');
            });
            if (page === 'courses') {
                document.getElementById('page-courses').classList.remove('hidden');
                renderSavedCourses();
                refreshCalendar();
            } else {
                document.getElementById(`page-${page}`).classList.remove('hidden');
                if (page === 'msgs') loadConversations();
                else if (page === 'notes') loadStudentNotes();
                else if (page === 'settings') loadProfile().then(loadSettingsPage);
            }
            ['courses', 'msgs', 'notes', 'settings'].forEach(p => {
                const btn = document.getElementById(`lnav-${p}-btn`);
                if (!btn) return;
                btn.classList.toggle('bg-white/20', p === page);
                btn.classList.toggle('text-white', p === page);
                btn.classList.toggle('text-white/70', p !== page);
            });
        }

        // ── 已加入课程（localStorage）─────────────────────────────
        function getSavedCourses() {
            return JSON.parse(localStorage.getItem(COURSES_KEY) || '[]');
        }
        function saveCourse(course) {
            const courses = getSavedCourses().filter(c => c.course_key !== course.course_key);
            courses.unshift({ ...course, joined_at: new Date().toISOString() });
            localStorage.setItem(COURSES_KEY, JSON.stringify(courses.slice(0, 20)));
        }
        function removeSavedCourse(course_key) {
            localStorage.setItem(COURSES_KEY,
                JSON.stringify(getSavedCourses().filter(c => c.course_key !== course_key)));
            renderSavedCourses();
        }

        function renderSavedCourses() {
            const courses = getSavedCourses();
            const list = document.getElementById('saved-courses-list');
            const joinForm = document.getElementById('join-form');
            const joinIcon = document.getElementById('join-toggle-icon');

            if (!courses.length) {
                list.innerHTML = '';
                joinForm.classList.remove('hidden');
                joinIcon.style.transform = 'rotate(180deg)';
                return;
            }

            list.innerHTML = courses.map(c => `
                <div class="bg-white rounded-2xl border border-gray-100 shadow-sm px-5 py-4 flex items-center justify-between group">
                    <div>
                        <p class="font-medium text-gray-800">${c.name}</p>
                        <p class="text-sm text-gray-400">课程码：<span class="font-mono">${c.course_key}</span></p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick='enterCourse(${JSON.stringify(c)})'
                            class="px-4 py-2 bg-blue-600 text-white text-sm rounded-xl hover:bg-blue-700 font-medium">
                            进入课程
                        </button>
                        <button onclick="removeSavedCourse('${c.course_key}')"
                            class="px-3 py-2 text-gray-300 hover:text-red-400 text-sm rounded-xl border border-gray-200 hover:border-red-200 opacity-0 group-hover:opacity-100 transition-opacity">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                </div>`).join('');
        }

        function toggleJoinForm() {
            const form = document.getElementById('join-form');
            const icon = document.getElementById('join-toggle-icon');
            const hidden = form.classList.toggle('hidden');
            icon.style.transform = hidden ? '' : 'rotate(180deg)';
            if (!hidden) setTimeout(() => document.getElementById('course-key-input').focus(), 50);
        }

        // ── 加入课程 ──────────────────────────────────────────────
        async function joinCourse() {
            const key = document.getElementById('course-key-input').value.trim();
            const msg = document.getElementById('join-msg');
            if (!key) { msg.className = 'text-sm mt-2 text-red-500'; msg.textContent = '请输入课程码'; return; }
            try {
                const res = await fetch(`${API}/api/courses/${key}`);
                const data = await res.json();
                if (!res.ok) { msg.className = 'text-sm mt-2 text-red-500'; msg.textContent = data.detail; return; }
                saveCourse(data);
                apiFetch(`${API}/api/courses/${key}/join`, {
                    method: 'POST', headers: authHeaders()
                }).catch(() => {});
                document.getElementById('course-key-input').value = '';
                msg.textContent = '';
                enterCourse(data);
            } catch { msg.className = 'text-sm mt-2 text-red-500'; msg.textContent = '连接失败，请检查后端'; }
        }

        function showCourseNotice(msg) {
            document.getElementById('course-notice-text').textContent = msg;
            const el = document.getElementById('course-notice');
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 6000);
        }

        let currentCourse = null;

        async function enterCourse(course) {
            const check = await fetch(`${API}/api/courses/${course.course_key}`);
            if (!check.ok) {
                removeSavedCourse(course.course_key);
                showCourseNotice(`「${course.name}」已被教师删除，已自动移除。`);
                return;
            }
            currentCourse = course;
            apiFetch(`${API}/api/courses/${course.course_key}/join`, {
                method: 'POST', headers: authHeaders()
            }).catch(() => {});
            document.getElementById('qa-course-title').textContent = `📚 ${course.name}`;
            document.getElementById('qa-course-key').textContent = `课程码：${course.course_key}`;
            document.getElementById('results').innerHTML = '';
            document.getElementById('question-input').value = '';
            document.getElementById('page-courses').classList.add('hidden');
            document.getElementById('page-qa').classList.remove('hidden');
            // 侧边栏保持高亮"我的课程"
            document.getElementById('lnav-courses-btn').classList.add('bg-white/20', 'text-white');
            document.getElementById('lnav-courses-btn').classList.remove('text-white/70');
            // 重置教材浏览面板
            _currentDocFilename = null;
            const _embed = document.getElementById('modal-pdf-browser-embed');
            if (_embed) { _embed.src = ''; _embed.classList.add('hidden'); }
            document.getElementById('modal-pdf-browser-placeholder')?.classList.remove('hidden');
            loadCourseDocuments();
        }

        // ── 教材浏览（独立窗口） ──────────────────────────────────
        function openPdfBrowser() {
            document.getElementById('modal-pdf-browser').classList.remove('hidden');
            if (currentCourse) loadCourseDocuments();
        }
        function closePdfBrowser() {
            document.getElementById('modal-pdf-browser').classList.add('hidden');
        }

        async function loadCourseDocuments() {
            if (!currentCourse) return;
            const listEl = document.getElementById('modal-doc-list');
            if (!listEl) return;
            listEl.innerHTML = '<p class="text-gray-400 text-xs text-center py-4">加载中...</p>';
            try {
                const res = await apiFetch(`${API}/api/documents/${currentCourse.course_key}/student`, { headers: authHeaders() });
                if (!res || !res.ok) { listEl.innerHTML = '<p class="text-gray-400 text-xs text-center py-4">加载失败</p>'; return; }
                renderCourseDocList(await res.json());
            } catch {
                listEl.innerHTML = '<p class="text-gray-400 text-xs text-center py-4">连接失败</p>';
            }
        }

        function renderCourseDocList(docs) {
            const listEl = document.getElementById('modal-doc-list');
            if (!listEl) return;
            if (!docs.length) {
                listEl.innerHTML = '<p class="text-gray-400 text-xs text-center py-5 px-3">教师尚未上传教材</p>';
                return;
            }
            listEl.innerHTML = docs.map(d => `
                <button onclick="previewCourseDoc('${d.filename}')" data-docname="${d.filename}"
                    class="course-doc-btn w-full flex items-center gap-2 px-4 py-3 text-left hover:bg-blue-50 border-b border-gray-50 transition-colors last:border-b-0">
                    <i class="fas fa-file-pdf text-red-400 text-sm shrink-0"></i>

        // ── 关键词高亮 ─────────────────────────────────────────────
        function highlight(text, question) {
            const queryWords = question.trim().toLowerCase().match(/[a-zA-Z一-龥]{2,}/g) || [];
            const textLower = text.toLowerCase();
            queryWords.forEach(kw => {
                if (!textLower.includes(kw)) return;
                const regex = new RegExp(`(${kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
                text = text.replace(regex,
                    '<mark class="bg-yellow-200 px-0.5 rounded font-semibold not-italic">$1</mark>');
            });
            return text;
        }

        async function askQuestion() {
            const question = document.getElementById('question-input').value.trim();
            if (!question) return alert('请输入问题');

            const courseCheck = await fetch(`${API}/api/courses/${currentCourse.course_key}`);
            if (!courseCheck.ok) {
                const deletedName = currentCourse.name;
                removeSavedCourse(currentCourse.course_key);
                navigateTo('courses');
                showCourseNotice(`「${deletedName}」已被教师删除，已自动退出。`);
                return;
            }

            if (_activeReader) {
                try { _activeReader.cancel(); } catch {}
                _activeReader = null;
            }

            // 每次提问先滚回顶部，确保结果区可见
            document.getElementById('qa-left-panel').scrollTop = 0;

            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = `
                <div class="text-center py-12 text-gray-400">
                    <i class="fas fa-spinner fa-spin text-3xl mb-3"></i><p>正在检索相关内容...</p>
                </div>`;

            let res;
            try {
                res = await apiFetch(`${API}/api/query/stream`, {
                    method: 'POST', headers: authHeaders(),
                    body: JSON.stringify({ course_id: currentCourse.course_key, question })
                });
            } catch {
                resultsDiv.innerHTML = `<div class="text-center py-12 text-red-400">连接失败，请检查后端</div>`;
                return;
            }
            if (!res) return;

            const reader = res.body.getReader();
            _activeReader = reader;
            const decoder = new TextDecoder();
            let buffer = '';
            let answerEl = null;
            let answerText = '';
            let hasTokens = false;
            let sourcesData = [];

            function handleStreamEvent(event) {
                if (event.type === 'chunks') {
                    sourcesData = event.sources || [];
                    renderResultsShell(event.chunks, question);
                    answerEl = document.getElementById('stream-answer-text');
                } else if (event.type === 'token') {
                    if (!hasTokens) {
                        hasTokens = true;
                        document.getElementById('answer-section')?.classList.remove('hidden');
                    }
                    answerText += event.content;
                    if (answerEl) answerEl.textContent = answerText + '▋';
                } else if (event.type === 'done') {
                    if (hasTokens) {
                        if (answerEl) answerEl.innerHTML = marked.parse(answerText);
                        _lastAiAnswer = answerText;
                        _lastAiQuestion = question;
                        const saveBtn = document.getElementById('save-ai-note-btn');
                        if (saveBtn) saveBtn.classList.remove('hidden');
                        if (sourcesData.length) {
                            const tagsEl = document.getElementById('source-tags');
                            if (tagsEl) {
                                tagsEl.innerHTML = sourcesData.map(s =>
                                    `<button onclick="openPdf('${s.doc_name}',${s.page_num})"
                                        class="inline-flex items-center px-3 py-1 bg-white text-blue-700 text-sm rounded-full border border-blue-200 hover:bg-blue-50 cursor-pointer">
                                        📍 《${s.doc_name.replace(/^[^_]+_/, '')}》 第 ${s.page_num} 页
                                    </button>`
                                ).join('');
                                tagsEl.classList.remove('hidden');
                            }
                        }
                    } else {
                        document.getElementById('answer-section')?.remove();
                        document.getElementById('chunks-details')?.setAttribute('open', '');
                    }
                }
            }

            try {
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    let idx;
                    while ((idx = buffer.indexOf('\n\n')) !== -1) {
                        const block = buffer.slice(0, idx);
                        buffer = buffer.slice(idx + 2);
                        for (const line of block.split('\n')) {
                            if (line.startsWith('data: ')) {
                                try { handleStreamEvent(JSON.parse(line.slice(6))); } catch {}
                            }
                        }
                    }
                }
            } catch {}
            _activeReader = null;
        }

            const content = document.getElementById('note-content-input').value.trim();

                _editingNoteId = null;
                return;

        async function saveNote() {
            const title = document.getElementById('note-title-input').value.trim();
            const content = document.getElementById('note-content-input').value.trim();
            if (!content) { alert('请输入笔记内容'); return; }
            const courseKey = document.getElementById('note-course-select').value;
            const isPublic = courseKey ? (document.querySelector('input[name="note-visibility"]:checked')?.value === 'public') : false;
            try {
                if (_editingNoteId) {
                    await apiFetch(`${API}/api/notes/${_editingNoteId}`, {
                        method: 'PUT', headers: authHeaders(),
                        body: JSON.stringify({ title, content, is_public: isPublic, course_key: courseKey })
                    });
                } else {
                    await apiFetch(`${API}/api/notes`, {
                        method: 'POST', headers: authHeaders(),
                        body: JSON.stringify({ course_key: courseKey, title, content, is_public: isPublic })
                    });
                }
                document.getElementById('modal-note-editor').classList.add('hidden');
                _editingNoteId = null;
                loadStudentNotes();
            } catch { alert('保存失败，请重试'); }
        }

                loadStudentNotes();
            } catch { alert('删除失败'); }

                        course_key: currentCourse?.course_key || '',
                        title: _lastAiQuestion || 'AI 问答笔记',
                        content: _lastAiAnswer,
                        is_public: false,
                        is_ai: true
                    })
                });
                if (res && res.ok) {
                    if (btn) {
                        btn.innerHTML = '<i class="fas fa-check text-xs"></i> 已保存';
                        btn.disabled = true;
                        btn.classList.add('opacity-60', 'cursor-not-allowed');
                    }
                }
            } catch { alert('保存失败，请重试'); }
        }

        // ── 事件绑定 ──────────────────────────────────────────────
        document.getElementById('modal-history').addEventListener('click', e => { if (e.target === e.currentTarget) closeHistory(); });
        document.getElementById('modal-pdf').addEventListener('click', e => { if (e.target === e.currentTarget) closePdf(); });
        document.getElementById('modal-profile').addEventListener('click', e => { if (e.target === e.currentTarget) closeProfileModal(); });
        document.getElementById('modal-partner-profile').addEventListener('click', e => { if (e.target === e.currentTarget) closePartnerProfile(); });
        document.getElementById('modal-history-picker').addEventListener('click', e => { if (e.target === e.currentTarget) closeHistoryPicker(); });
        document.getElementById('modal-group-members').addEventListener('click', e => { if (e.target === e.currentTarget) closeGroupMembersList(); });
        document.getElementById('modal-schedule-day').addEventListener('click', e => { if (e.target === e.currentTarget) closeScheduleModal(); });
        document.getElementById('modal-pdf-browser').addEventListener('click', e => { if (e.target === e.currentTarget) closePdfBrowser(); });
        document.getElementById('modal-note-editor').addEventListener('click', e => { if (e.target === e.currentTarget) closeNoteEditor(); });
        document.getElementById('modal-note-viewer').addEventListener('click', e => { if (e.target === e.currentTarget) closeNoteViewer(); });
        document.getElementById('question-input').addEventListener('keypress', e => { if (e.key === 'Enter') askQuestion(); });
        document.getElementById('course-key-input').addEventListener('keypress', e => { if (e.key === 'Enter') joinCourse(); });
        document.getElementById('msg-input').addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMessage(); }
        });
        document.getElementById('msg-input').addEventListener('input', e => {
            e.target.style.height = 'auto';
            e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
        });
        document.getElementById('group-msg-input').addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendGroupMessage(); }
        });
        document.getElementById('group-msg-input').addEventListener('input', e => {
            e.target.style.height = 'auto';
            e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
        });
        document.addEventListener('click', e => {
            if (!e.target.closest('#conv-menu-btn') && !e.target.closest('#conv-menu-dropdown')) closeConvMenu();
            if (!e.target.closest('#group-menu-btn') && !e.target.closest('#group-menu-dropdown')) closeGroupMenu();
            if (!e.target.closest('#student-notes-filter-wrap')) document.getElementById('student-notes-filter-dropdown')?.classList.add('hidden');
        });

        // ── 初始化 ────────────────────────────────────────────────
        loadSavedTheme();
        loadSavedDark();
        updateNavIdentity(user?.nickname?.trim() || user?.username || '', user?.avatar || null);
        loadProfile();
        renderSavedCourses();
        initCalendar();
        checkScheduleNotifications();
        startMsgPoll();
    </script>
</body>
</html>
